services:
  relay:
    build: .
    restart: unless-stopped
    user: "${RELAY_UID:-10001}:${RELAY_GID:-10001}"
    working_dir: /app
    volumes:
      - type: bind
        source: .
        target: /app
        read_only: true
        bind:
          create_host_path: false
    environment:
      RELAY_TOKEN: ${RELAY_TOKEN:?Set a random token of at least 32 characters in .env}
      RELAY_PUBLIC_URL: ${RELAY_PUBLIC_URL:-https://super.tkcloud.online:444}
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8767:8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
